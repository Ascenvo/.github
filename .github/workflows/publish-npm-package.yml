name: publish-npm-package

on:
    workflow_call:
        inputs:
            node-version:
                required: false
                type: string
                default: "22"

permissions:
    contents: read
    actions: write
    packages: write

jobs:
    # ===== GATE: skip everything below if this version is already published =====
    check-version:
        name: Check version
        runs-on: ubuntu-latest
        timeout-minutes: 5
        outputs:
            should-publish: ${{ steps.check.outputs.should-publish }}
        steps:
            - uses: Ascenvo/.github/.github/actions/setup-npm-registry@main
              with:
                  node-version: ${{ inputs.node-version }}

            - name: Compare local version against the published version
              id: check
              env:
                  NODE_AUTH_TOKEN: ${{ github.token }}
              run: |
                  NAME=$(node -p "require('./package.json').name")
                  LOCAL_VERSION=$(node -p "require('./package.json').version")
                  PUBLISHED_VERSION=$(npm view "$NAME" version 2>/dev/null || echo "")
                  echo "local version: $LOCAL_VERSION"
                  echo "published version: ${PUBLISHED_VERSION:-<none>}"
                  if [ "$LOCAL_VERSION" = "$PUBLISHED_VERSION" ]; then
                      echo "Version unchanged — nothing to publish."
                      echo "should-publish=false" >> "$GITHUB_OUTPUT"
                  else
                      echo "should-publish=true" >> "$GITHUB_OUTPUT"
                  fi

    # ===== PUBLISH: local-runner-with-GitHub-fallback, via the shared base =====
    publish:
        name: Publish
        needs: [check-version]
        if: needs.check-version.outputs.should-publish == 'true'
        uses: Ascenvo/.github/.github/workflows/run-with-fallback.yml@main
        with:
            command: npm publish
            job-label: Publish
            node-version: ${{ inputs.node-version }}
        permissions:
            contents: read
            actions: write
            packages: write
