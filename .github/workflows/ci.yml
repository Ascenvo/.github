name: status-checks

on:
    pull_request:
        branches: [develop, production, release/**]
    push:
        branches: [production, develop]
    workflow_call:

concurrency:
    group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
    cancel-in-progress: true

permissions:
    contents: read

jobs:
    checks:
        name: Lint, format, types, tests
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v5
              with:
                  submodules: recursive
                  token: ${{ secrets.WORKFLOW_ACCESS_TOKEN || github.token }}

            - name: Detect Node project
              id: detect
              run: echo "exists=$([ -f package.json ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

            - uses: actions/setup-node@v4
              if: steps.detect.outputs.exists == 'true'
              with:
                  node-version: 22
                  cache: npm

            - run: npm ci
              if: steps.detect.outputs.exists == 'true'

            - run: npm run lint --if-present
              if: steps.detect.outputs.exists == 'true'

            - run: npm run format-check --if-present
              if: steps.detect.outputs.exists == 'true'

            - run: npm run typecheck --if-present
              if: steps.detect.outputs.exists == 'true'

            - run: npm run test --if-present
              if: steps.detect.outputs.exists == 'true'

            - run: npm run test:coverage --if-present
              if: steps.detect.outputs.exists == 'true'

            - uses: actions/upload-artifact@v4
              if: steps.detect.outputs.exists == 'true' && hashFiles('coverage/**') != ''
              with:
                  name: coverage-report
                  path: coverage
                  if-no-files-found: ignore

    build:
        name: Build
        needs: checks
        runs-on: ubuntu-latest
        environment:
            name: ${{ github.ref == 'refs/heads/production' && 'production' || 'development' }}
        steps:
            - uses: actions/checkout@v5
              with:
                  submodules: recursive
                  token: ${{ secrets.WORKFLOW_ACCESS_TOKEN || github.token }}

            - name: Detect Node project
              id: detect
              run: echo "exists=$([ -f package.json ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

            - uses: actions/setup-node@v4
              if: steps.detect.outputs.exists == 'true'
              with:
                  node-version: 22
                  cache: npm

            - run: npm ci
              if: steps.detect.outputs.exists == 'true'

            - run: npm run build --if-present
              if: steps.detect.outputs.exists == 'true'
